monitor=,preferred,auto,1 exec-once=hyprpaper exec-once=mako exec-once=waybar exec-once=nm-applet exec-once=blueman-applet

input { kb_layout=us follow_mouse=1 sensitivity=0 touchpad { natural_scroll=true } }

general { gaps_in=5 gaps_out=10 border_size=2 col.active_border=rgba(33ccffee) rgba(00ff99ee) 45deg col.inactive_border=rgba(595959aa) layout=dwindle allow_tearing=true }

decoration { rounding=10 drop_shadow=true shadow_range=4 shadow_render_power=3 col.shadow=rgba(1a1a1aee) }

animations { enabled=true bezier=myBezier,0.05,0.9,0.1,1.05 animation=windows,1,7,myBezier animation=windowsOut,1,7,default,popin 80% animation=border,1,10,default animation=fade,1,7,default animation=workspaces,1,6,default }

dwindle { pseudotile=true preserve_split=true }

master { new_status=master }

gestures { workspace_swipe=true }

misc { force_default_wallpaper=0 disable_hyprland_logo=true vrr=1 vfr=true }
